name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Docker 29 on the runners rejects the API version Testcontainers 1.21 negotiates by default.
      - name: Allow older Docker API clients
        run: |
          docker version --format 'server {{.Server.Version}} api {{.Server.APIVersion}} min {{.Server.MinAPIVersion}}'
          cfg=/etc/docker/daemon.json
          if [ -f $cfg ]; then sudo jq '. + {"min-api-version":"1.24"}' $cfg > /tmp/daemon.json; else echo '{"min-api-version":"1.24"}' > /tmp/daemon.json; fi
          sudo mv /tmp/daemon.json $cfg
          sudo systemctl restart docker
          docker version --format 'server {{.Server.Version}} api {{.Server.APIVersion}} min {{.Server.MinAPIVersion}}'
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
      - name: Failed test summary
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          seen = set()
          for f in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(f).getroot()
              for tc in r.iter("testcase"):
                  for k in ("failure", "error"):
                      e = tc.find(k)
                      if e is None:
                          continue
                      text = e.text or ""
                      causes = [l.strip() for l in text.splitlines() if l.strip().startswith("Caused by") or "Exception:" in l][:6]
                      msg = (e.get("message") or "") + " | " + " | ".join(causes)
                      key = msg[:300]
                      if key in seen:
                          continue
                      seen.add(key)
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::" + msg[:3500].replace("\n", " ").replace("%", "%25"))
          PY

  frontend:
    name: Front end (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @kadreo/backoffice build
