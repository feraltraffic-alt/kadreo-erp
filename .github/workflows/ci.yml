name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Docker 29 on the runners rejects the API version Testcontainers 1.21 negotiates by default.
      - name: Allow older Docker API clients
        run: |
          docker version --format 'server {{.Server.Version}} api {{.Server.APIVersion}} min {{.Server.MinAPIVersion}}'
          cfg=/etc/docker/daemon.json
          if [ -f $cfg ]; then sudo jq '. + {"min-api-version":"1.24"}' $cfg > /tmp/daemon.json; else echo '{"min-api-version":"1.24"}' > /tmp/daemon.json; fi
          sudo mv /tmp/daemon.json $cfg
          sudo systemctl restart docker
          docker version --format 'server {{.Server.Version}} api {{.Server.APIVersion}} min {{.Server.MinAPIVersion}}'
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
      - name: Failed test summary
        if: failure()
        run: |
          python3 - <<'PY2'
          import glob, re, xml.etree.ElementTree as ET
          seen = set()
          server = []
          for f in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(f).getroot()
              for tc in r.iter("testcase"):
                  for k in ("failure", "error"):
                      e = tc.find(k)
                      if e is None:
                          continue
                      text = e.text or ""
                      causes = [l.strip() for l in text.splitlines() if l.strip().startswith("Caused by") or "Exception:" in l][:6]
                      msg = (e.get("message") or "") + " | " + " | ".join(causes)
                      key = msg[:300]
                      if key in seen:
                          continue
                      seen.add(key)
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::" + msg[:3500].replace("\n", " ").replace("%", "%25"))
              # Server-side exceptions logged by the application during the tests.
              for out in list(r.iter("system-out")) + list(r.iter("system-err")):
                  lines = (out.text or "").splitlines()
                  for i, l in enumerate(lines):
                      if "Unhandled error" in l or (" ERROR " in l and "ApiExceptionHandler" not in l):
                          block = [l.strip()[-300:]]
                          frames = 0
                          for x in lines[i + 1:i + 600]:
                              xs = x.strip()
                              if xs.startswith("at "):
                                  if "com.kadreo" in xs and frames < 3:
                                      frames += 1
                                      block.append(xs[:200])
                                  continue
                              if xs.startswith("Caused by") or "ERROR:" in xs or "Position:" in xs:
                                  block.append(xs[:400])
                          sig = " ".join(b for b in block if not b.startswith("at "))[:200]
                          if sig not in seen:
                              seen.add(sig)
                              server.append(" | ".join(block[:14]))
          if server:
              print("::error title=Server-side exceptions::" + " || ".join(server)[:16000].replace("%", "%25"))
          PY2

  frontend:
    name: Front end (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @kadreo/backoffice build

  stack:
    name: Docker Compose stack (db + backend + web + portal + mobile)
    # Playwright browsers do not support Ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up -d --build --wait db && docker compose up -d --build backend web portal mobile
      - name: Wait for the backend (seed loads on first start)
        run: |
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8080/actuator/health | grep -q UP; then echo "up after ${i}x2s"; exit 0; fi
            sleep 2
          done
          docker compose logs backend | tail -80
          exit 1
      - name: Smoke test through the web proxy
        run: |
          set -e
          TOKEN=$(curl -fs -X POST http://localhost:8081/api/v1/dev/token -H 'Content-Type: application/json' -d '{"email":"marta.kowalska@demo-outsourcing.pl"}' | jq -r .accessToken)
          get() { curl -fs -H "Authorization: Bearer $TOKEN" "http://localhost:8081/api/v1$1"; }
          get /me | jq -e '.fullName == "Marta Kowalska"'
          get /dashboard/summary | jq -e '.onShiftNow == 464 and .plannedNow == 478'
          get /timesheets | jq -e 'length == 23'
          curl -fs http://localhost:8081/ | grep -q '<div id="root">'
          curl -fs http://localhost:8082/ | grep -q '<div id="root">'
          curl -fs http://localhost:8083/ | grep -q 'id="root"'
          WT=$(curl -fs -X POST http://localhost:8083/api/v1/dev/token -H 'Content-Type: application/json' -d '{"email":"viktor.hnatiuk@kadreo-demo.app"}' | jq -r .accessToken)
          curl -fs -H "Authorization: Bearer $WT" http://localhost:8083/api/v1/me/today | jq -e '.state == "on_shift" and .shift.start == "06:00"'
          echo "stack OK"
      - name: Browser flow against the stack
        run: |
          set -o pipefail
          report() { echo "::error title=$1::$(tail -c 6000 "$2" | tr '\n' ' ' | sed 's/%/%25/g')"; exit 1; }
          pip install --quiet playwright==1.58.0 > /tmp/pw.log 2>&1 || report "pip install" /tmp/pw.log
          python -m playwright install --with-deps chromium > /tmp/pw.log 2>&1 || report "playwright install" /tmp/pw.log
          python e2e/stack_flow.py http://localhost:8081 > /tmp/e2e.log 2>&1 || report "browser flow" /tmp/e2e.log
          cat /tmp/e2e.log
          python e2e/portal_flow.py http://localhost:8082 http://localhost:8081 > /tmp/portal.log 2>&1 || report "portal flow" /tmp/portal.log
          cat /tmp/portal.log
          python e2e/mobile_flow.py http://localhost:8083 > /tmp/mobile.log 2>&1 || report "mobile flow" /tmp/mobile.log
          cat /tmp/mobile.log
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/out
          retention-days: 7
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
