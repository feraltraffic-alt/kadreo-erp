name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
      - name: Failed test summary
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob("build/test-results/test/*.xml"):
              r = ET.parse(f).getroot()
              for tc in r.iter("testcase"):
                  for k in ("failure", "error"):
                      e = tc.find(k)
                      if e is not None:
                          print(f"::error title={tc.get('classname')}.{tc.get('name')}::" + (e.get("message") or "")[:900].replace("\n", " "))
                          print((e.text or "")[:3000])
          PY

  frontend:
    name: Front end (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present typecheck
      - run: pnpm --filter @kadreo/backoffice build
