# Local stand: PostgreSQL 16 + PostGIS, the backend with the demo tenant, the back office.
#   docker compose up --build      → back office http://localhost:8081, client portal http://localhost:8082
#                                     (API docs: http://localhost:8080/swagger-ui.html)
name: kadreo

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: kadreo
      POSTGRES_USER: kadreo
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:-kadreo}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:-kadreo_app}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadreo -d kadreo"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/kadreo
      DB_APP_USER: kadreo_app
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-kadreo_app}
      DB_OWNER_USER: kadreo
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-kadreo}
      CORS_ORIGINS: http://localhost:8081,http://localhost:8082,http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
    depends_on:
      - backend
    ports:
      - "8081:80"

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  db-data:
